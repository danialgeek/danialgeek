    <path d="M 157,157 C 142,172 123,179 105,180 C 109,176 112,170 113,165 C 135,160 153,144 160,122 C 165,124 171,129 173,135 C 176,146 168,155 157,157 Z" fill="#1e252d" />
    <path d="M 43,157 C 28,142 21,123 20,105 C 24,109 30,112 35,113 C 40,135 56,153 78,160 C 76,165 71,171 65,173 C 54,176 45,168 43,157 Z" fill="#1e252d" />

    <!-- Center Pink/Magenta Disc -->
