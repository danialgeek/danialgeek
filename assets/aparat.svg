  </defs>

  <g id="aparat-logo">
    <!-- 4 outer shutter blades rotated symmetrically around center (100, 100) -->
    <path d="M 43,43 C 58,28 77,21 95,20 C 91,24 88,30 87,35 C 65,40 47,56 40,78 C 35,76 29,71 27,65 C 24,54 32,45 43,43 Z" fill="#1e252d" />
