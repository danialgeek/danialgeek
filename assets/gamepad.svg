<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100%" height="100%">
  <defs>
    <linearGradient id="gp-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a2be2" />
      <stop offset="100%" stop-color="#4a0082" />
    </linearGradient>
    <filter id="gp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Gamepad Body -->
  <path d="M26 18 C36 14 64 14 74 18 C88 22 96 42 90 64 C87 74 76 76 68 68 C61 61 57 58 50 58 C43 58 39 61 32 68 C24 76 13 74 10 64 C4 42 12 22 26 18 Z" 
        fill="url(#gp-body)" stroke="#00f2fe" stroke-width="1.8" filter="url(#gp-glow)" />
  
  <!-- D-Pad on Left -->
  <rect x="23" y="32" width="6" height="18" rx="2" fill="#161d2b" stroke="rgba(255,255,255,0.4)" stroke-width="0.8" />
  <rect x="17" y="38" width="18" height="6" rx="2" fill="#161d2b" stroke="rgba(255,255,255,0.4)" stroke-width="0.8" />
  <circle cx="26" cy="41" r="2.5" fill="#00f2fe" />

  <!-- Action Buttons on Right (4 diamond dots) -->
  <circle cx="74" cy="33" r="3.2" fill="#ff007f" />
  <circle cx="81" cy="40" r="3.2" fill="#00f2fe" />
  <circle cx="74" cy="47" r="3.2" fill="#ffe600" />
  <circle cx="67" cy="40" r="3.2" fill="#dcb8ff" />

  <!-- Center Thumbsticks & Details -->
  <circle cx="39" cy="48" r="6" fill="#121721" stroke="#8a2be2" stroke-width="1.5" />
  <circle cx="39" cy="48" r="3" fill="#6700b5" />

  <circle cx="61" cy="48" r="6" fill="#121721" stroke="#8a2be2" stroke-width="1.5" />
  <circle cx="61" cy="48" r="3" fill="#6700b5" />

  <!-- Menu / Home Buttons -->
  <circle cx="45" cy="36" r="2" fill="rgba(255,255,255,0.6)" />
  <circle cx="55" cy="36" r="2" fill="rgba(255,255,255,0.6)" />
  <rect x="47" y="28" width="6" height="3" rx="1.5" fill="#00f2fe" />
</svg>
