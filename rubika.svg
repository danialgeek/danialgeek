<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Filter for crisp presentation -->
    <clipPath id="hex-clip">
      <!-- Rounded hexagon clip path -->
      <path d="M 100,14 C 104,14 108,16 110,19 L 176,57 C 180,59 182,63 182,67 L 182,133 C 182,137 180,141 176,143 L 110,181 C 108,184 104,186 100,186 C 96,186 92,184 90,181 L 24,143 C 20,141 18,137 18,133 L 18,67 C 18,63 20,59 24,57 L 90,19 C 92,16 96,14 100,14 Z" />
    </clipPath>
  </defs>

  <g clip-path="url(#hex-clip)">
    <!-- 12 Colored Outer Facets -->
    
    <!-- Top Lime / Green (12 to 1 o'clock) -->
    <polygon points="100,14 141,38 100,62" fill="#78be20" />
    <polygon points="100,14 100,62 59,38" fill="#93c90e" />

    <!-- Top-Right Cyan / Teal (1 to 2 o'clock) -->
    <polygon points="141,38 182,62 141,85" fill="#00b4d8" />
    <polygon points="141,38 141,85 100,62" fill="#0096c7" />

    <!-- Right Violet / Purple (2 to 4 o'clock) -->
    <polygon points="182,62 182,100 141,100" fill="#7209b7" />
    <polygon points="182,62 141,85 141,100" fill="#6a0dad" />
    <polygon points="182,100 182,138 141,115" fill="#480ca8" />
    <polygon points="182,100 141,100 141,115" fill="#3f37c9" />

    <!-- Bottom-Right Red / Orange (4 to 5 o'clock) -->
    <polygon points="182,138 141,162 141,115" fill="#e63946" />
    <polygon points="141,162 100,186 100,138" fill="#f77f00" />
    <polygon points="141,162 100,138 141,115" fill="#fb8500" />

    <!-- Bottom Green / Lime (5 to 7 o'clock) -->
    <polygon points="100,186 59,162 100,138" fill="#8cb312" />

    <!-- Bottom-Left Teal / Mint (7 to 8 o'clock) -->
    <polygon points="59,162 18,138 59,115" fill="#06d6a0" />
    <polygon points="59,162 59,115 100,138" fill="#118ab2" />

    <!-- Left Deep Purple / Indigo (8 to 10 o'clock) -->
    <polygon points="18,138 18,100 59,100" fill="#3a0ca3" />
    <polygon points="18,100 18,62 59,85" fill="#d90429" />
    <polygon points="18,100 59,85 59,100" fill="#560bad" />
    <polygon points="18,138 59,100 59,115" fill="#240046" />

    <!-- Top-Left Orange / Amber (10 to 12 o'clock) -->
    <polygon points="18,62 59,38 59,85" fill="#f3722c" />
    <polygon points="59,38 100,62 59,85" fill="#f8961e" />
    <polygon points="59,38 100,14 100,62" fill="#f9c74f" />

    <!-- Central 3D Cube -->
    <!-- Top Face (White) -->
    <polygon points="100,62 136,83 100,104 64,83" fill="#ffffff" />
    
    <!-- Left Face (Soft cool-gray / shadow) -->
    <polygon points="64,83 100,104 100,146 64,125" fill="#e2e6ea" />

    <!-- Right Face (Crisp light-gray) -->
    <polygon points="100,104 136,83 136,125 100,146" fill="#f0f3f6" />
  </g>
</svg>
